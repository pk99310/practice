apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: practice
  template:
    metadata:
      labels:
        app: practice
    spec:
      containers:
        - name: practice
          image: ghcr.io/pk99310/practice:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /hello
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /hello
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: practice
spec:
  selector:
    app: practice
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
